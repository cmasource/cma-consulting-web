<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #06111f;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #ddebEE;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, rgba(18, 214, 196, 0.14), transparent 28%),
          radial-gradient(circle at 15% 30%, rgba(125, 239, 228, 0.08), transparent 22%),
          radial-gradient(circle at 85% 65%, rgba(18, 214, 196, 0.08), transparent 24%),
          #06111f;
      }

      .frame {
        position: absolute;
        inset: 0;
        padding: 88px 116px 86px;
        display: flex;
        flex-direction: column;
        gap: 46px;
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.24;
        background-image:
          linear-gradient(rgba(40, 75, 99, 0.45) 1px, transparent 1px),
          linear-gradient(90deg, rgba(40, 75, 99, 0.45) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(circle at 50% 50%, black 0%, black 58%, transparent 88%);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 48%, rgba(0, 0, 0, 0.44) 100%);
        pointer-events: none;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 2;
      }

      .eyebrow {
        font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
        font-size: 20px;
        color: #7defe4;
        text-transform: uppercase;
        letter-spacing: 0.28em;
      }

      .duration {
        font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
        font-size: 20px;
        color: #8fa8b4;
        font-variant-numeric: tabular-nums;
      }

      .system {
        position: relative;
        z-index: 2;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 500px minmax(0, 1fr);
        gap: 52px;
        align-items: center;
      }

      .panel,
      .core-panel {
        min-height: 700px;
        border: 1px solid rgba(125, 239, 228, 0.16);
        background: linear-gradient(180deg, rgba(11, 32, 53, 0.82), rgba(6, 17, 31, 0.74));
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(221, 235, 238, 0.05);
      }

      .panel {
        border-radius: 34px;
        padding: 54px 50px 46px;
        display: flex;
        flex-direction: column;
        gap: 38px;
      }

      .panel-title {
        font-size: 58px;
        line-height: 1.04;
        font-weight: 760;
        color: #eef8f8;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 66px;
        padding: 0 4px;
        color: #ddebEE;
        font-size: 29px;
        line-height: 1.18;
        font-weight: 380;
      }

      .item::before {
        content: "";
        flex: 0 0 13px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #12d6c4;
        box-shadow: 0 0 18px rgba(18, 214, 196, 0.66);
      }

      .left-panel .item::before {
        background: rgba(143, 168, 180, 0.72);
        box-shadow: 0 0 12px rgba(143, 168, 180, 0.36);
      }

      .core-panel {
        position: relative;
        border-radius: 34px;
        padding: 50px 42px 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }

      .core-title {
        font-size: 48px;
        line-height: 1.08;
        font-weight: 760;
        color: #eef8f8;
        text-align: center;
      }

      .core {
        position: relative;
        width: 330px;
        height: 330px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 50%, rgba(125, 239, 228, 0.9) 0 3%, rgba(18, 214, 196, 0.26) 20%, transparent 62%),
          radial-gradient(circle, rgba(18, 214, 196, 0.16), transparent 68%);
        border: 1px solid rgba(125, 239, 228, 0.38);
        box-shadow:
          0 0 58px rgba(18, 214, 196, 0.42),
          0 0 120px rgba(18, 214, 196, 0.22),
          inset 0 0 38px rgba(125, 239, 228, 0.28);
      }

      .core::before,
      .core::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        inset: 24px;
        border: 1px solid rgba(125, 239, 228, 0.28);
      }

      .core::after {
        inset: 62px;
        border-color: rgba(221, 235, 238, 0.18);
      }

      .core-stack {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-align: center;
      }

      .core-word {
        display: block;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #eef8f8;
        font-size: 38px;
        line-height: 1.02;
        font-weight: 760;
        letter-spacing: -0.035em;
        text-transform: lowercase;
        text-shadow: 0 0 24px rgba(18, 214, 196, 0.2);
      }

      .signal-label {
        font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
        font-size: 17px;
        color: #9fc2c9;
        text-transform: uppercase;
        letter-spacing: 0.22em;
      }

      .flow-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #12d6c4;
        opacity: 0;
        box-shadow: 0 0 18px rgba(18, 214, 196, 0.78);
      }

      .connector {
        position: absolute;
        top: 538px;
        width: 236px;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(18, 214, 196, 0.78), transparent);
        opacity: 0.44;
        z-index: 1;
      }

      .connector-left {
        left: 644px;
      }

      .connector-right {
        right: 644px;
      }

      .chart {
        margin-top: auto;
        height: 128px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 22px;
        align-items: end;
      }

      .bars {
        height: 112px;
        display: flex;
        gap: 14px;
        align-items: end;
      }

      .bar {
        width: 22px;
        height: var(--h);
        min-height: 22px;
        transform-origin: bottom;
        background: linear-gradient(180deg, #7defe4, #12d6c4);
        box-shadow: 0 0 18px rgba(18, 214, 196, 0.4);
      }

      .line-wrap {
        height: 112px;
        align-self: end;
      }

      .metric-line {
        width: 100%;
        height: 112px;
        overflow: visible;
      }

      .metric-line path {
        fill: none;
        stroke: #7defe4;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 8px rgba(18, 214, 196, 0.68));
      }

      .metric-line circle {
        fill: #7defe4;
        filter: drop-shadow(0 0 8px rgba(18, 214, 196, 0.68));
      }

      .corner {
        position: absolute;
        width: 46px;
        height: 46px;
        border-color: rgba(125, 239, 228, 0.32);
        opacity: 0.65;
      }

      .corner.tl {
        top: 64px;
        left: 78px;
        border-top: 1px solid;
        border-left: 1px solid;
      }

      .corner.tr {
        top: 64px;
        right: 78px;
        border-top: 1px solid;
        border-right: 1px solid;
      }

      .corner.bl {
        bottom: 64px;
        left: 78px;
        border-bottom: 1px solid;
        border-left: 1px solid;
      }

      .corner.br {
        right: 78px;
        bottom: 64px;
        border-right: 1px solid;
        border-bottom: 1px solid;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div class="grid" data-layout-ignore></div>
      <div class="vignette" data-layout-ignore></div>
      <div class="corner tl" data-layout-ignore></div>
      <div class="corner tr" data-layout-ignore></div>
      <div class="corner bl" data-layout-ignore></div>
      <div class="corner br" data-layout-ignore></div>
      <div class="connector connector-left" data-layout-ignore></div>
      <div class="connector connector-right" data-layout-ignore></div>

      <div class="frame">
        <div class="topline">
          <div class="eyebrow">Sistema operativo de gestion</div>
          <div class="duration">08s / loop</div>
        </div>

        <main class="system">
          <section class="panel left-panel">
            <h1 class="panel-title">Gestión dispersa</h1>
            <div class="list">
              <div class="item left-item">Costos poco claros</div>
              <div class="item left-item">Datos aislados</div>
              <div class="item left-item">Ventas sin seguimiento</div>
              <div class="item left-item">Tareas manuales</div>
            </div>
          </section>

          <section class="core-panel">
            <h2 class="core-title">Diagnóstico CMA</h2>
            <div class="core">
              <div class="core-stack">
                <span class="core-word">detectar</span>
                <span class="core-word">ordenar</span>
                <span class="core-word">priorizar</span>
              </div>
            </div>
            <div class="signal-label">prioridad operativa</div>
          </section>

          <section class="panel right-panel">
            <h2 class="panel-title">Empresa ordenada</h2>
            <div class="list">
              <div class="item right-item">Procesos definidos</div>
              <div class="item right-item">Indicadores visibles</div>
              <div class="item right-item">Herramientas conectadas</div>
              <div class="item right-item">Decisiones medibles</div>
            </div>
            <div class="chart" data-layout-ignore>
              <div class="bars">
                <div class="bar" style="--h: 48px"></div>
                <div class="bar" style="--h: 68px"></div>
                <div class="bar" style="--h: 86px"></div>
                <div class="bar" style="--h: 108px"></div>
              </div>
              <div class="line-wrap">
                <svg class="metric-line" viewBox="0 0 250 112" aria-hidden="true">
                  <path class="line-path" d="M8 96 C55 82, 74 76, 108 58 S174 32, 238 14" pathLength="1"></path>
                  <circle class="line-dot" cx="238" cy="14" r="8"></circle>
                </svg>
              </div>
            </div>
          </section>
        </main>
      </div>

      <div class="flow-layer" data-layout-ignore>
        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>
        <span class="particle p9"></span>
        <span class="particle p10"></span>
        <span class="particle p11"></span>
        <span class="particle p12"></span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      tl.set(".right-item", { opacity: 0.56, x: 0 }, 0);
      tl.set(".bar", { scaleY: 0.32, opacity: 0.42 }, 0);
      tl.set(".line-path", { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0.36 }, 0);
      tl.set(".line-dot", { opacity: 0, scale: 0.7, transformOrigin: "center center" }, 0);

      tl.from(".topline", { opacity: 0, y: -28, duration: 0.65, ease: "power3.out" }, 0.18);
      tl.from(".left-panel", { opacity: 0, x: -44, duration: 0.78, ease: "expo.out" }, 0.28);
      tl.from(".core-panel", { opacity: 0, scale: 0.94, duration: 0.82, ease: "back.out(1.15)" }, 0.46);
      tl.from(".right-panel", { opacity: 0, x: 44, duration: 0.78, ease: "circ.out" }, 0.66);
      tl.from(".connector", { opacity: 0, scaleX: 0.2, duration: 0.72, ease: "power2.out" }, 0.82);

      tl.from(".panel-title", { opacity: 0, y: 24, duration: 0.58, stagger: 0.08, ease: "power2.out" }, 0.52);
      tl.from(".left-item", { opacity: 0, x: -18, y: 12, duration: 0.46, stagger: 0.09, ease: "sine.out" }, 0.82);
      tl.from(".core-word", { opacity: 0, scale: 0.82, duration: 0.42, stagger: 0.1, ease: "back.out(1.6)" }, 1.08);
      tl.from(".signal-label", { opacity: 0, y: 18, duration: 0.48, ease: "power1.out" }, 1.26);

      tl.to(".left-item", {
        x: (i) => [-7, 5, -4, 6][i],
        y: (i) => [3, -5, 4, -3][i],
        rotation: (i) => [-0.35, 0.25, -0.2, 0.3][i],
        duration: 1.15,
        stagger: 0.08,
        repeat: 5,
        yoyo: true,
        ease: "sine.inOut"
      }, 1.35);

      tl.to(".core", {
        scale: 1.045,
        boxShadow: "0 0 82px rgba(18, 214, 196, 0.58), 0 0 148px rgba(18, 214, 196, 0.28), inset 0 0 44px rgba(125, 239, 228, 0.34)",
        duration: 0.78,
        repeat: 4,
        yoyo: true,
        ease: "sine.inOut"
      }, 1.42);

      const leftToCore = [
        [548, 390, 872, 478],
        [570, 464, 882, 520],
        [548, 540, 872, 548],
        [574, 612, 884, 586],
        [526, 452, 864, 502],
        [552, 574, 878, 560]
      ];

      const coreToRight = [
        [1030, 478, 1344, 392],
        [1042, 520, 1370, 464],
        [1032, 548, 1348, 540],
        [1044, 586, 1378, 614],
        [1030, 502, 1358, 446],
        [1040, 560, 1368, 574]
      ];

      leftToCore.forEach((p, i) => {
        const selector = `.p${i + 1}`;
        tl.set(selector, { x: p[0], y: p[1], opacity: 0, scale: 0.85 }, 1.72 + i * 0.12);
        tl.to(selector, { opacity: 0.92, duration: 0.18, ease: "power1.out" }, 1.78 + i * 0.12);
        tl.to(selector, { x: p[2], y: p[3], scale: 1.15, duration: 1.15, ease: "power2.inOut" }, 1.8 + i * 0.12);
        tl.to(selector, { opacity: 0, scale: 0.55, duration: 0.24, ease: "power1.in" }, 2.72 + i * 0.12);
      });

      coreToRight.forEach((p, i) => {
        const selector = `.p${i + 7}`;
        tl.set(selector, { x: p[0], y: p[1], opacity: 0, scale: 0.85 }, 4.08 + i * 0.13);
        tl.to(selector, { opacity: 0.95, duration: 0.18, ease: "power1.out" }, 4.12 + i * 0.13);
        tl.to(selector, { x: p[2], y: p[3], scale: 1.12, duration: 1.08, ease: "power2.inOut" }, 4.15 + i * 0.13);
        tl.to(selector, { opacity: 0, scale: 0.55, duration: 0.24, ease: "power1.in" }, 5.02 + i * 0.13);
      });

      tl.fromTo(".right-item", { x: 22 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.15, ease: "power2.out" }, 4.95);
      tl.to(".bar", { scaleY: 1, opacity: 1, duration: 0.68, stagger: 0.12, ease: "expo.out" }, 5.35);
      tl.to(".line-path", { strokeDashoffset: 0, opacity: 1, duration: 0.95, ease: "power2.out" }, 5.55);
      tl.to(".line-dot", { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(1.7)" }, 6.22);

      tl.to(".right-panel", {
        boxShadow: "0 28px 96px rgba(0, 0, 0, 0.38), 0 0 62px rgba(18, 214, 196, 0.16), inset 0 1px 0 rgba(221, 235, 238, 0.08)",
        duration: 0.64,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut"
      }, 6.14);

      tl.to(".right-item", { opacity: 0.56, duration: 0.72, stagger: 0.04, ease: "sine.inOut" }, 7.08);
      tl.to(".bar", { scaleY: 0.32, opacity: 0.42, duration: 0.72, stagger: 0.04, ease: "sine.inOut" }, 7.1);
      tl.to(".line-path", { strokeDashoffset: 1, opacity: 0.36, duration: 0.74, ease: "sine.inOut" }, 7.12);
      tl.to(".line-dot", { opacity: 0, scale: 0.7, duration: 0.42, ease: "sine.inOut" }, 7.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
